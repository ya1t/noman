<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loom Beading Pattern Generator</title>
  <style>
    .pattern-container {
      display: flex;
      gap: 50px;
      margin-top: 20px;
    }
    .pattern-grid {
      display: grid;
      gap: 2px;
    }
    .bead {
      width: 20px;
      height: 20px;
      border: 1px solid #ddd;
      background-color: white;
    }
    .color-sample {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 1px solid #000;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <h1>Loom Beading Pattern Generator</h1>

  <!-- Pattern Generation Section -->
  <div>
    <label for="bead-count">Number of Beads per Row:</label>
    <input type="number" id="bead-count" min="1" max="50" value="5">
  </div>

  <div>
    <label for="rows-count">Number of Rows:</label>
    <input type="number" id="rows-count" min="1" max="50" value="6">
  </div>

  <div>
    <label>Select Bead Colors:</label>
    <input type="color" id="selected-color-1" value="#FF0000">
    <input type="color" id="selected-color-2" value="#00FF00">
    <input type="color" id="selected-color-3" value="#0000FF">
    <input type="color" id="selected-color-4" value="#FFFF00">
    <input type="color" id="selected-color-5" value="#FF00FF">
  </div>

  <button id="generate">Generate Grid</button>
  <button id="save-pattern">Save Pattern</button>

  <!-- Repeat Count Section -->
  <div>
    <label for="repeat-count">Repeat Pattern (Vertically):</label>
    <input type="number" id="repeat-count" min="1" max="10" value="1">
  </div>

  <button id="create-final-pattern">Generate Final Pattern</button>

  <!-- Pattern Display Section -->
  <div class="pattern-container">
    <div>
      <h3>Initial Pattern</h3>
      <div id="initial-pattern" class="pattern-grid"></div>
      <h3>Total Beads for Initial Pattern:</h3>
      <ul id="initial-total-beads"></ul>
    </div>
    <div>
      <h3>Final Pattern</h3>
      <div id="final-pattern" class="pattern-grid"></div>
      <h3>Total Beads for Final Pattern:</h3>
      <ul id="final-total-beads"></ul>
    </div>
  </div>

  <!-- Buttons for PDF and JPG Downloads -->
  <button id="download-pdf">Download as PDF</button>
  <button id="download-jpg">Download as JPG</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="../js/beadLoomPattern.js"></script>
</body>
</html>
